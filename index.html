    heartFilled: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
    // Shuffle icon (Lucide)
    shuffle: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>`,
    // Spinner icon (Lucide LoaderCircle)
    spinner: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: mp-spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`,
    // X icon (Lucide)
    close: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
  };

  // Create the outer wrapper (for positioning)
  const wrapper = document.createElement('div');
  wrapper.className = 'mp-banner';
  wrapper.style.cssText = `
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  `;

  // Create the pill-shaped container (h-10 px-4 bg-black rounded-full shadow-lg)
  const pill = document.createElement('div');
  pill.className = 'mp-pill';
  pill.style.cssText = `
    height: 40px;
    padding: 0 16px;
    background-color: #000000;
    border-radius: 9999px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  `;

  // ===== LEFT SIDE: Logo + "Made with MagicPath" (flex items-center gap-2) =====
  const leftSide = document.createElement('a');
  leftSide.className = 'mp-left-side';
  leftSide.href = webBaseUrl;
  leftSide.target = '_blank';
  leftSide.style.cssText = `
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    cursor: pointer;
    flex-shrink: 0;
  `;

  // Logo icon container
  const logoContainer = document.createElement('span');
  logoContainer.innerHTML = icons.logo;
  logoContainer.style.cssText = `
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  `;

  // "Made with MagicPath" text
  const brandText = document.createElement('span');
  brandText.className = 'mp-brand-text';
  brandText.textContent = 'Made with MagicPath';
  brandText.style.cssText = `
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
  `;

  leftSide.appendChild(logoContainer);
  leftSide.appendChild(brandText);

  // ===== RIGHT SIDE: Stats + Remix + Close (flex items-center gap-4) =====
  const rightSide = document.createElement('div');
  rightSide.className = 'mp-right-side';
  rightSide.style.cssText = `
    display: flex;
    align-items: center;
    gap: 16px;
  `;

  // View count stat (flex items-center gap-1.5 text-white/80)
  const viewStat = document.createElement('div');
  viewStat.style.cssText = `
    display: flex;
    align-items: center;
    gap: 6px;
    color: rgba(255, 255, 255, 0.8);
  `;
  viewStat.innerHTML = icons.eye;
  const viewCountSpan = document.createElement('span');
  viewCountSpan.textContent = formatCount(viewCount);
  viewCountSpan.style.cssText = `
    font-size: 14px;
    font-weight: 500;
  `;
  viewStat.appendChild(viewCountSpan);

  // Like button (clickable, flex items-center gap-1.5)
  const likeButton = document.createElement('button');
  likeButton.style.cssText = `
    display: flex;
    align-items: center;
    gap: 6px;
    color: rgba(255, 255, 255, 0.8);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s ease;
  `;

  const likeIconSpan = document.createElement('span');
  likeIconSpan.style.cssText = `display: flex; align-items: center;`;
  likeIconSpan.innerHTML = icons.heart;

  const likeCountSpan = document.createElement('span');
  likeCountSpan.textContent = formatCount(likeCount);
  likeCountSpan.style.cssText = `
    font-size: 14px;
    font-weight: 500;
  `;

  likeButton.appendChild(likeIconSpan);
  likeButton.appendChild(likeCountSpan);

  function updateLikeButton() {
    likeIconSpan.innerHTML = isLiked ? icons.heartFilled : icons.heart;
    likeCountSpan.textContent = formatCount(likeCount);
    likeButton.style.color = isLiked ? '#ef4444' : 'rgba(255, 255, 255, 0.8)';
  }

  likeButton.addEventListener('mouseenter', () => {
    if (!isLiked) {
      likeButton.style.color = '#ffffff';
    }
  });
  likeButton.addEventListener('mouseleave', () => {
    likeButton.style.color = isLiked ? '#ef4444' : 'rgba(255, 255, 255, 0.8)';
  });

  // Remix button (pill-shaped: flex items-center gap-1.5 px-3 py-1 bg-white/10 hover:bg-white/20 rounded-full)
  const remixButton = document.createElement('button');
  remixButton.style.cssText = `
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background-color: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 9999px;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s ease;
  `;

  function updateRemixButton(loading = false) {
    if (loading) {
      remixButton.innerHTML = `
        <span style="display: flex; align-items: center;">${icons.spinner}</span>
        <span>Loading…</span>
      `;
      remixButton.disabled = true;
      remixButton.style.opacity = '0.5';
      remixButton.style.cursor = 'not-allowed';
    } else {
      let html = `
        <span style="display: flex; align-items: center;">${icons.shuffle}</span>
        <span>Remix</span>
      `;
      if (remixCount > 0) {
        html += `<span style="color: rgba(255, 255, 255, 0.6);">${formatCount(remixCount)}</span>`;
      }
      remixButton.innerHTML = html;
      remixButton.disabled = false;
      remixButton.style.opacity = '1';
      remixButton.style.cursor = 'pointer';
    }
  }
  updateRemixButton(false);

  remixButton.addEventListener('mouseenter', () => {
    if (!isProcessing) {
      remixButton.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
    }
  });
  remixButton.addEventListener('mouseleave', () => {
    if (!isProcessing) {
      remixButton.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
    }
  });

  // Close button (flex items-center justify-center text-white/60 hover:text-white)
  const closeButton = document.createElement('button');
  closeButton.innerHTML = icons.close;
  closeButton.setAttribute('aria-label', 'Close banner');
  closeButton.style.cssText = `
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    padding: 0;
    transition: color 0.2s ease;
  `;

  closeButton.addEventListener('mouseenter', () => {
    closeButton.style.color = '#ffffff';
  });
  closeButton.addEventListener('mouseleave', () => {
    closeButton.style.color = 'rgba(255, 255, 255, 0.6)';
  });

  // Assemble right side
  rightSide.appendChild(viewStat);
  rightSide.appendChild(likeButton);
  rightSide.appendChild(remixButton);
  rightSide.appendChild(closeButton);

  // Assemble pill
  pill.appendChild(leftSide);
  pill.appendChild(rightSide);

  // Assemble wrapper
  wrapper.appendChild(pill);

  // Add to page
  document.body.appendChild(wrapper);

  // ===== SCROLL BEHAVIOR: Hide on scroll down, show on scroll up =====
  let hiddenAtScrollY = 0;

  function handleScroll() {
    const currentScrollY = window.scrollY;

    // Ignore overscroll/bounce (negative or beyond document)
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    if (currentScrollY < 0 || currentScrollY > maxScroll) {
      return;
    }

    if (currentScrollY > lastScrollY && currentScrollY > 50) {
      // Scrolling down past 50px
      if (!isHiddenByScroll) {
        isHiddenByScroll = true;
        hiddenAtScrollY = currentScrollY;
        updateVisibility();
      }
    } else if (currentScrollY < lastScrollY) {
      // Scrolling up - only show after scrolling up 50px from where it was hidden
      if (isHiddenByScroll && hiddenAtScrollY - currentScrollY >= 50) {
        isHiddenByScroll = false;
        updateVisibility();
      }
    }

    lastScrollY = currentScrollY;
  }

  function updateVisibility() {
    if (isDismissed) {
      wrapper.style.display = 'none';
      return;
    }

    if (isHiddenByScroll) {
      wrapper.classList.add('mp-hidden');
    } else {
      wrapper.classList.remove('mp-hidden');
    }
  }

  window.addEventListener('scroll', handleScroll, { passive: true });

  // ===== DISMISS HANDLER =====
  closeButton.addEventListener('click', () => {
    isDismissed = true;
    wrapper.classList.add('mp-hidden');
    setTimeout(() => {
      wrapper.remove();
    }, 300);
  });

  // ===== LIKE HANDLER =====
  async function handleLike() {
    if (isLiking) return;

    if (!currentUser) {
      // Redirect to login
      const currentUrl = window.location.href.split('?')[0];
      const loginUrl = `${webBaseUrl}?returnUrl=${encodeURIComponent(currentUrl)}`;
      window.location.href = loginUrl;
      return;
    }

    // Optimistic update
    const previousLiked = isLiked;
    const previousCount = likeCount;

    isLiked = !isLiked;
    likeCount = isLiked ? likeCount + 1 : likeCount - 1;
    updateLikeButton();
    isLiking = true;

    try {
      const response = await fetch(`${apiBaseUrl}/components/${componentId}/like`, {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
        },
      });

      if (!response.ok) {
        throw new Error('Failed to toggle like');
      }
    } catch (error) {
      console.error('MagicPath: Like failed', error);
      // Revert on failure
      isLiked = previousLiked;
      likeCount = previousCount;
      updateLikeButton();
    } finally {
      isLiking = false;
    }
  }

  likeButton.addEventListener('click', handleLike);

  // ===== REMIX HANDLER =====
  async function performRemix() {
    if (isProcessing) return;
    isProcessing = true;
    updateRemixButton(true);

    try {
      const response = await fetch(`${apiBaseUrl}/components/${componentId}/copy-to-new-project?sendEmail=true`, {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
        },
      });

      if (!response.ok) {
        throw new Error(`Failed to copy: ${response.status}`);
      }

      const data = await response.json();
      const projectId = data.data.project.id;

      window.location.href = `${webBaseUrl}/files/${projectId}`;
    } catch (error) {
      console.error('MagicPath: Remix failed', error);
      alert('The owner of this project has not enabled public remixes.');
      isProcessing = false;
      updateRemixButton(false);
    }
  }

  remixButton.addEventListener('click', async () => {
    if (isProcessing) return;

    if (currentUser) {
      performRemix();
    } else {
      // Redirect to login with return URL
      const currentUrl = window.location.href.split('?')[0];
      const returnUrl = `${currentUrl}?remix=true`;
      const loginUrl = `${webBaseUrl}?returnUrl=${encodeURIComponent(returnUrl)}`;
      window.location.href = loginUrl;
    }
  });

  // ===== AUTH CHECK =====
  async function checkAuth() {
    try {
      const response = await fetch(`${apiBaseUrl}/users/me`, {
        method: 'GET',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
        },
      });

      if (response.ok) {
        const data = await response.json();
        currentUser = data.user;

        // Check if user has liked this component
        if (currentUser) {
          try {
            const likeResponse = await fetch(`${apiBaseUrl}/components/${componentId}/like`, {
              method: 'GET',
              credentials: 'include',
              headers: {
                'Content-Type': 'application/json',
              },
            });

            if (likeResponse.ok) {
              const likeData = await likeResponse.json();
              isLiked = likeData.data?.liked || false;
              updateLikeButton();
            }
          } catch (likeError) {
            console.debug('MagicPath: Failed to check like status');
          }
        }

        return true;
      }
    } catch (error) {
      console.debug('MagicPath: User not authenticated');
    }
    return false;
  }

  // ===== AUTO-REMIX ON RETURN =====
  async function checkForAutoRemix() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('remix') === 'true') {
      // Clean the URL
      const cleanUrl = window.location.href.split('?')[0];
      window.history.replaceState({}, document.title, cleanUrl);

      const isLoggedIn = await checkAuth();
      if (isLoggedIn) {
        performRemix();
      }
    } else {
      checkAuth();
    }
  }

  // Initialize
  checkForAutoRemix();
})();
